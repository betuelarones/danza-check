# =====================================================================
# DanzaCheck - configuracion base
#
# Ninguna credencial real vive en el repositorio: todo llega por
# variables de entorno. Los valores por defecto que aparecen aqui son
# solo de desarrollo local y deben ser reemplazados al desplegar.
# =====================================================================

spring.application.name=danza-check

# Puerto del servidor. Render inyecta la variable PORT automaticamente.
server.port=${PORT:8080}

# --- Base de datos (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/danzacheck}
spring.datasource.username=${DB_USERNAME:danza}
spring.datasource.password=${DB_PASSWORD:danza}

# --- JPA / Hibernate ---
# ddl-auto=update es practico en desarrollo. En produccion debe ser
# "validate": el esquema se crea a mano en Supabase con los scripts de
# db/ (ver README, seccion "Base de datos").
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# --- Stream de asistencias (SSE) ---
# Latido periodico para que la conexion no se cierre por inactividad.
app.stream.heartbeat-ms=${STREAM_HEARTBEAT_MS:25000}
# 0 = sin limite de vida; el cliente reconecta si se cae.
app.stream.timeout-ms=${STREAM_TIMEOUT_MS:0}

# --- Jackson ---
# Jackson 3 escribe fechas y horas en ISO-8601 sin configuracion extra:
# LocalDate -> "2026-09-25", LocalTime -> "19:00:00",
# LocalDateTime -> "2026-09-25T19:34:20.123".

# --- CORS: origen(es) autorizado(s) del frontend React ---
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# --- Administrador unico (delegado de danza) ---
app.security.admin.username=${ADMIN_USERNAME:admin}
app.security.admin.password=${ADMIN_PASSWORD:}

# --- JWT (firmado con HS256) ---
app.security.jwt.secret=${JWT_SECRET:}
app.security.jwt.issuer=${JWT_ISSUER:danzacheck}
app.security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
