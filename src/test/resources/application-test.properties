# =====================================================================
# Perfil de pruebas: usa H2 en modo PostgreSQL en memoria.
# No toca la configuracion de PostgreSQL del entorno principal y no
# depende de ningun servicio externo. Los credenciales de abajo son
# ficticios y existen solo para este perfil.
# =====================================================================

spring.datasource.url=jdbc:h2:mem:danzacheck-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.cors.allowed-origins=http://localhost:5173

app.security.admin.username=admin-test
app.security.admin.password=password-test

app.security.jwt.secret=clave-de-pruebas-solo-para-automatizar-tests-jwt
app.security.jwt.issuer=danzacheck-test
app.security.jwt.expiration-minutes=30
